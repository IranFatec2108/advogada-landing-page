<section
  id="inicio"
  class="relative overflow-hidden bg-base pt-12 pb-20 lg:pt-20 lg:pb-28"
>
  <div class="mx-auto grid max-w-7xl items-center gap-12 px-6 lg:grid-cols-2 lg:px-10">
    <!-- Texto -->
    <div class="max-w-2xl">
      <p
        class="mb-4 inline-flex items-center gap-2 rounded-full border border-secondary/20 bg-secondary/5 px-4 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-secondary"
      >
        Advocacia estratégica
      </p>

      <h1
        class="font-serif text-4xl leading-tight tracking-tight text-text-primary sm:text-5xl lg:text-6xl"
      >
        Segurança jurídica com presença, clareza e sofisticação.
      </h1>

      <p class="mt-6 max-w-xl text-base leading-8 text-text-primary/75 sm:text-lg">
        Atendimento jurídico personalizado para quem busca orientação objetiva,
        estratégia e acompanhamento próximo em cada etapa do caso.
      </p>

      <div class="mt-8 flex flex-col gap-3 sm:flex-row">
        <button
          type="button"
          class="border border-secondary bg-secondary px-6 py-4 text-sm font-semibold uppercase tracking-[0.12em] text-base transition-colors hover:border-accent hover:bg-accent"
          (click)="scrollToContact()"
        >
          Falar pelo WhatsApp
        </button>

        <button
          type="button"
          class="border border-black/10 bg-transparent px-6 py-4 text-sm font-semibold uppercase tracking-[0.12em] text-text-primary transition-colors hover:border-accent hover:text-accent"
          (click)="scrollToServices()"
        >
          Ver serviços
        </button>
      </div>
    </div>

    <!-- Imagem -->
    <div class="relative flex justify-center lg:justify-end">
      <div class="relative w-full max-w-[420px]">
        <div
          class="absolute inset-0 -translate-x-4 translate-y-4 rounded-[2rem] border border-accent/30 bg-accent/5"
          aria-hidden="true"
        ></div>

        <div class="relative overflow-hidden rounded-[2rem] border border-black/10 bg-white shadow-[0_20px_60px_rgba(0,0,0,0.10)]">
          <img
            src="/assets/images/hero-lawyer.webp"
            alt="Retrato profissional da advogada Ana Carolina Vargas"
            class="h-[560px] w-full object-cover object-top sm:h-[620px]"
          />
        </div>
      </div>
    </div>
  </div>
</section>
